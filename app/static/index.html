<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1929">
  <title>MotivationOS</title>
  <script src="/review-assets/nav.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0A1929; color: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 56px 24px 32px; background: radial-gradient(ellipse at 50% 20%, #19334b, #0A1929 62%); }
    main { max-width: 900px; margin: 0 auto; padding: clamp(72px, 15vh, 150px) 0 60px; text-align: center; }
    .eyebrow { color: #FFD400; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(48px, 9vw, 88px); line-height: 1; letter-spacing: -.055em; }
    .intro { margin: 20px auto 44px; max-width: 560px; color: #b8c6d4; font-size: 18px; line-height: 1.6; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }
    .actions a { min-width: 205px; padding: 17px 22px; border: 1px solid #42566a; border-radius: 10px; color: #f5f7fa; text-decoration: none; font-weight: 700; background: #11263a; transition: transform .15s, border-color .15s, background .15s; }
    .actions a:hover, .actions a:focus-visible { transform: translateY(-2px); border-color: #FFD400; background: #1b3248; outline: none; }
    .actions a.primary { color: #0A1929; border-color: #FFD400; background: #FFD400; }
    .actions a.primary:hover, .actions a.primary:focus-visible { background: #ffe34d; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Your creative operations workspace</p>
    <h1>MotivationOS</h1>
    <p class="intro">Move from a great script to a finished production with clear, thoughtful review at every step.</p>
    <nav class="actions" aria-label="Workspaces">
      <a class="primary" href="/review">Script Review</a>
      <a href="/production-review">Production Review</a>
      <a href="/docs">API Documentation</a>
    </nav>
  </main>
</body>
</html>
