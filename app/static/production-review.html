<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Review | MotivationOS"><style>
body{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17221d;background:#f3f5ef}label{display:block;margin:.8rem 0 .25rem}input,button{font:inherit;padding:.7rem}video{width:min(100%,540px);display:block;background:#111;margin:1rem 0}pre{white-space:pre-wrap;background:white;padding:1rem;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}section{background:#fff;padding:1rem;border-radius:10px}#error{color:#a21d25}
</style></head><body><h1>Final video review</h1><p>Local, authenticated, read-only review. This page cannot approve or publish.</p><form id="auth"><label>Admin token<input id="token" type="password" required autocomplete="off"></label><label>Production ID<input id="id" required></label><button>Load review</button></form><p id="error" role="alert"></p><main id="content" hidden><h2 id="title"></h2><video id="video" controls playsinline></video><div class="grid"><section><h2>Script</h2><pre id="script"></pre></section><section><h2>Description</h2><pre id="description"></pre></section><section><h2>Rendering status</h2><pre id="status"></pre></section><section><h2>Audio QA</h2><pre id="audio"></pre></section><section><h2>Video QA</h2><pre id="videoqa"></pre></section><section><h2>Validation findings</h2><pre id="findings"></pre></section></div></main><script src="/review-assets/production-review.js" defer></script></body></html>
